# Release pipeline for herdr-observr. Releases are opt-in — the merge queue
# merging PRs into main never cuts a release. A release is kicked off by running
# the "Release" workflow manually from the Actions tab (workflow_dispatch),
# optionally pinning a version or letting it auto-bump the patch number. The
# flow:
#
#   1. Determines the next version:
#        - workflow_dispatch: the version you typed, or an auto-bump of the
#          patch number read from internal/version/version.go.
#        - tag push (v*): fired by the dispatch run creating the tag — the tag
#          itself is the version.
#   2. On the dispatch path only: syncs the version into BOTH version.go and
#      herdr-plugin.toml, commits with [skip ci], and pushes straight to main.
#      Direct pushes to main are normally blocked by the main ruleset, but the
#      github-actions integration has an "always" bypass there — humans still
#      need a PR merged through the merge queue. Then it creates and pushes tag
#      v<x.y.z>, which re-triggers this workflow on the tag-push event.
#   3. Runs goreleaser to cross-compile binaries (linux/darwin x amd64/arm64),
#      attach them to a GitHub Release, and push an updated Homebrew formula
#      into Formula/ in this same repo (another [skip ci] direct push under the
#      same bypass — no separate tap repo or PAT required).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 0.4.0). Leave blank to auto-bump the patch number."
        required: false

# Pushing the version bump, the brew formula, and the release tag all need write
# access to the repo's contents.
permissions:
  contents: write

# Serialise releases — no two version bumps racing each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so goreleaser sees prior tags for changelog generation.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # The dispatch run (and the tag-push run it triggers) both need a git
      # identity for the bump commit, the release tag, and the formula push.
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Dispatch: use the pinned input version, else auto-bump the patch number.
      # Tag push: the tag name IS the version.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            INPUT_VERSION="${{ github.event.inputs.version }}"
            if [[ -n "$INPUT_VERSION" ]]; then
              echo "Using pinned version $INPUT_VERSION"
              echo "version=$INPUT_VERSION"
              echo "is_dispatch=true"
              exit 0
            fi

            CURRENT=$(sed -nE 's/.*const Version = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' internal/version/version.go)
            if [[ -z "$CURRENT" ]]; then
              echo "Could not parse version from internal/version/version.go" >&2
              exit 1
            fi

            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Auto-bumping $CURRENT → $NEW"
            echo "version=$NEW"
            echo "is_dispatch=true"
            exit 0
          fi

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Releasing tagged version $VERSION"
          echo "version=$VERSION"
          echo "is_dispatch=false"

      # Dispatch-only: sync the release version into BOTH files that carry it and
      # push the commit straight to main (github-actions bypass on the main
      # ruleset). [skip ci] stops the push from re-triggering workflows.
      #   - internal/version/version.go (printed by `herdr-observr version`)
      #   - herdr-plugin.toml's `version` field (what herdr shows in the plugin
      #     install preview and `herdr plugin list`)
      # The diff guard makes it a no-op when both files already match.
      - name: Sync version into version.go + manifest
        if: steps.version.outputs.is_dispatch == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"

          sed -i -E "s/(const Version = )\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"$NEW\"/" internal/version/version.go
          sed -i -E "s/^(version = )\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"$NEW\"/" herdr-plugin.toml

          if git diff --quiet internal/version/version.go herdr-plugin.toml; then
            echo "version.go and herdr-plugin.toml already at v$NEW — nothing to commit."
          else
            git add internal/version/version.go herdr-plugin.toml
            git commit -m "Release v$NEW [skip ci]"
            git push origin HEAD:main
          fi

      # Dispatch-only: create + push the tag. The tag push re-triggers this
      # workflow on the push:tags path, which runs goreleaser below.
      - name: Tag release
        if: steps.version.outputs.is_dispatch == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "Tag v$NEW already exists, skipping."
            exit 0
          fi
          git tag -a "v$NEW" -m "Release v$NEW"
          git push origin "v$NEW"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # Same-repo brew formula push uses the default workflow token — no
          # separate tap repo or PAT needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}