name: Feature request
description: Propose a feature or improvement for herdr-observr
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Please describe the problem you're
        solving rather than just a desired implementation — that gives room for
        the best design to surface.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? How would you use it?
      placeholder: "I want to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear description of what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds you've thought about.
    validations:
      required: false