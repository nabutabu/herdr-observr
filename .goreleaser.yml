# GoReleaser config for herdr-observr. Driven by .github/workflows/release.yml on
# every push to main: that workflow bumps internal/version/version.go, tags
# v<x.y.z>, then invokes `goreleaser release --clean`. GoReleaser then
# cross-compiles the binary, archives it, attaches it to a GitHub Release, and
# pushes an updated Homebrew formula into Formula/ in this same repo.
#
# These prebuilt archives are also what `herdr plugin install` downloads when the
# machine has no Go toolchain (see scripts/build.sh) and what install.sh fetches.

version: 2

project_name: herdr-observr

before:
  hooks:
    - go mod tidy

builds:
  - id: herdr-observr
    binary: herdr-observr
    main: .
    env:
      - CGO_ENABLED=0
    # The manifest declares platforms = ["linux", "macos"] — the socket transport
    # in internal/client is a Unix socket, so Windows (named pipes) is out of
    # scope for now. Ship both arches for the supported OSes.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

# Homebrew formula committed straight back into this repo under Formula/.
# Installs the standalone binary on your PATH; to use it as a herdr plugin,
# register it with `herdr plugin install` (or link the install). Users install
# the binary via:
#
#   brew tap nabutabu/herdr-observr https://github.com/nabutabu/herdr-observr
#   brew install nabutabu/herdr-observr/herdr-observr
#
# Because the formula lives in the same repo as the source, the default
# GITHUB_TOKEN the workflow already holds is enough to push it — no PAT, no
# separate tap repo. The [skip ci] marker on the formula-update commit stops the
# new push from triggering a second release run.
brews:
  - name: herdr-observr
    repository:
      owner: nabutabu
      name: herdr-observr
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_msg_template: "Update {{ .ProjectName }} brew formula to {{ .Tag }} [skip ci]"
    homepage: "https://github.com/nabutabu/herdr-observr"
    description: "herdr-observr — agent runtime health telemetry for herdr exported over OTLP."
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "herdr-observr"
    test: |
      assert_path_exists bin/"herdr-observr"